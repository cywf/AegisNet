apiVersion: v1
kind: Namespace
metadata:
  name: aegisnet
  labels:
    name: aegisnet
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisnet-config
  namespace: aegisnet
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
---
apiVersion: v1
kind: Secret
metadata:
  name: aegisnet-secrets
  namespace: aegisnet
type: Opaque
stringData:
  # Update these values with your actual secrets
  # Use kubectl create secret or external secret managers in production
  DB_PASSWORD: "changeme"
  API_KEY: "changeme"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisnet-app
  namespace: aegisnet
  labels:
    app: aegisnet
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegisnet
      component: backend
  template:
    metadata:
      labels:
        app: aegisnet
        component: backend
    spec:
      containers:
      - name: aegisnet
        image: aegisnet/app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: aegisnet-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: aegisnet-config
              key: LOG_LEVEL
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aegisnet-secrets
              key: DB_PASSWORD
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: aegisnet-service
  namespace: aegisnet
  labels:
    app: aegisnet
spec:
  type: LoadBalancer
  selector:
    app: aegisnet
    component: backend
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegisnet-hpa
  namespace: aegisnet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegisnet-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
