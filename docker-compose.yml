version: '3.8'

services:
  # AegisNet Main Application
  aegisnet-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: aegisnet-app
    hostname: aegisnet-app
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    volumes:
      - ./:/app
      - aegisnet-data:/data
    networks:
      - aegisnet-network
